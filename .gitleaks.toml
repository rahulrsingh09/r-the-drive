title = "Panda Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "jwt"

[[rules.allowlists]]
description = "Known non-signable JWT-shaped token in the chart E2E fixture history"
condition = "AND"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJzdWIiOiJlMmUtdXNlciJ9\.$''']
paths = ['''^apps/web/tests/e2e/(?:chart-management|dashboard-editability|fork-lock)\.spec\.ts$''']

[[rules.allowlists]]
description = "Unsigned synthetic owner JWT for browser-only API fixtures"
condition = "AND"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJzdWIiOiIzMzMzMzMzMy0zMzMzLTQzMzMtODMzMy0zMzMzMzMzMzMzMzMifQ\.$''']
paths = ['''^apps/web/tests/e2e/r-experience\.fixture\.ts$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Known non-signable JWT-shaped token in the chart E2E fixture history"
condition = "AND"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJzdWIiOiJlMmUtdXNlciJ9\.$''']
paths = ['''^apps/web/tests/e2e/(?:chart-management|dashboard-editability)\.spec\.ts$''']

[[rules.allowlists]]
description = "Unsigned synthetic JWTs used only by browser API fixtures"
condition = "AND"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJub25lIn0\.(?:eyJzdWIiOiJlMmUtdXNlciJ9|eyJzdWIiOiIzMzMzMzMzMy0zMzMzLTQzMzMtODMzMy0zMzMzMzMzMzMzMzMifQ)\.$''']
paths = ['''^apps/web/tests/e2e/(?:fork-lock\.spec\.ts|r-experience\.fixture\.ts)$''']

[[rules.allowlists]]
description = "Synthetic Cloudflare audience used only by local gateway tests"
condition = "AND"
regexTarget = "secret"
regexes = ['''^synthetic-audience-1234567890$''']
paths = ['''^apps/private-gateway/(?:runtime-check\.mjs|test/(?:maps|worker)\.test\.mjs)$''']

[[rules.allowlists]]
description = "Known documentation and chart-series placeholder values in repository history"
condition = "AND"
regexTarget = "secret"
regexes = ['''^(?:degradation-(?:10-20|20-30)|panda_[0-9a-f]{32})$''']
paths = ['''^(?:docs/wiki-drafts/13-API-Keys\.md|packages/dashboards/src/widgets/chart/DashboardChartWidget\.tsx)$''']

[[rules]]
id = "age-secret-key"

[[rules.allowlists]]
description = "Known non-functional Age identity used by historical route tests"
condition = "AND"
regexTarget = "secret"
regexes = ['''^AGE-SECRET-KEY-1Q+$''']
paths = ['''^apps/api/src/routes/(?:[a-z_]+\.rs|vehicles/tests\.rs)$''']

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Known API-key placeholder in historical documentation"
condition = "AND"
regexTarget = "secret"
regexes = ['''^panda_[0-9a-f]{32}$''']
paths = ['''^docs/wiki-drafts/13-API-Keys\.md$''']
