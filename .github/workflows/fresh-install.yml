name: Fresh install

on:
  push:
    branches:
      - main
    paths:
      - 'compose/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/hooks/**'
      - 'packages/types/**'
      - 'scripts/check-compose-contracts.mjs'
      - 'scripts/validate-compose.mjs'
      - 'scripts/verify-fresh-install.mjs'
      - '.github/workflows/fresh-install.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Verification path
        required: true
        default: production
        type: choice
        options: [production, dev]

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  fresh-install:
    name: Fresh install acceptance
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify migration integrity
        run: node tools/migration-integrity.mjs
      - run: pnpm install --frozen-lockfile
      - name: Run isolated acceptance
        run: |
          fresh_env="$RUNNER_TEMP/fresh-install.env"
          python3 - "$fresh_env" <<'PY'
          import re
          import secrets
          import sys
          from pathlib import Path

          values = {
              "DATABASE_URL": "postgresql://panda:fresh-install-password@timescaledb:5432/panda",
              "POSTGRES_PASSWORD": "fresh-install-password",
              "REDIS_PASSWORD": "fresh-install-redis-password",
              "ALLOWED_ORIGINS": "https://fresh-install.example.test",
          }
          content = Path("compose/.env.example").read_bytes().decode()
          pattern = re.compile(r"(DATABASE_URL|POSTGRES_PASSWORD|REDIS_PASSWORD|ALLOWED_ORIGINS)=.*")
          configured = pattern.sub(lambda match: match[1] + "=" + values[match[1]], content)
          Path(sys.argv[1]).write_bytes((configured + "PANDA_SETUP_TOKEN=" + secrets.token_hex(32) + "\n").encode())
          PY
          pnpm verify:fresh-install -- --mode "${{ inputs.mode || 'production' }}" --production-env "$fresh_env" --source-build
