name: Candidate image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag, or branch to build
        required: true
        default: dev
        type: string
      platform:
        description: Native platform candidate to build
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64, both]

env:
  REGISTRY: ghcr.io
  OWNER: your-org

concurrency:
  group: candidate-image-${{ github.ref }}-${{ inputs.platform || 'amd64' }}
  cancel-in-progress: false

jobs:
  resolve:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      platform: ${{ steps.source.outputs.platform }}
      build_version: ${{ steps.source.outputs.build_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - id: source
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'amd64' }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_ref=$REQUESTED_SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "platform=$REQUESTED_PLATFORM" >> "$GITHUB_OUTPUT"
          build_version=$(node scripts/resolve-build-version.mjs --candidate)
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  build-amd64:
    name: Build candidate (amd64)
    needs: resolve
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true' && (needs.resolve.outputs.platform == 'amd64' || needs.resolve.outputs.platform == 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Apply pnpm patch compatibility overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("compose/Dockerfile")
          contents = path.read_text()
          compatibility = "RUN pnpm config set allowUnusedPatches true --location project"
          if compatibility not in contents:
              pieces = contents.split("RUN pnpm install --frozen-lockfile")
              if len(pieces) != 2:
                  raise SystemExit(f"Expected exactly one install seam in {path}")
              overlay = compatibility + " \\\n              && pnpm install --frozen-lockfile"
              path.write_text(overlay.join(pieces))
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start timing
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./compose/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: PANDA_BUILD_VERSION=${{ needs.resolve.outputs.build_version }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda:candidate-${{ needs.resolve.outputs.source_sha }}-amd64
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/panda:buildcache-amd64-v2
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/panda:buildcache-amd64-v2,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true,ignore-error=true
          labels: |
            org.opencontainers.image.source=https://github.com/your-org/r-the-drive
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.build_version }}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summarize candidate
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          finished=$(date +%s)
          duration=$((finished - BUILD_STARTED_AT))
          echo "### Candidate image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ needs.resolve.outputs.source_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build and cache export: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

  build-arm64:
    name: Build candidate (arm64, manual)
    needs: resolve
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true' && (github.event_name == 'workflow_dispatch' && (needs.resolve.outputs.platform == 'arm64' || needs.resolve.outputs.platform == 'both'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Apply pnpm patch compatibility overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("compose/Dockerfile")
          contents = path.read_text()
          compatibility = "RUN pnpm config set allowUnusedPatches true --location project"
          if compatibility not in contents:
              pieces = contents.split("RUN pnpm install --frozen-lockfile")
              if len(pieces) != 2:
                  raise SystemExit(f"Expected exactly one install seam in {path}")
              overlay = compatibility + " \\\n              && pnpm install --frozen-lockfile"
              path.write_text(overlay.join(pieces))
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start timing
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./compose/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: PANDA_BUILD_VERSION=${{ needs.resolve.outputs.build_version }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda:candidate-${{ needs.resolve.outputs.source_sha }}-arm64
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/panda:buildcache-arm64-v2
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/panda:buildcache-arm64-v2,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true,ignore-error=true
          labels: |
            org.opencontainers.image.source=https://github.com/your-org/r-the-drive
            org.opencontainers.image.revision=${{ needs.resolve.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.build_version }}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summarize candidate
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          finished=$(date +%s)
          duration=$((finished - BUILD_STARTED_AT))
          echo "### Candidate image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ needs.resolve.outputs.source_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build and cache export: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: Promote current dev candidate
    needs: [resolve, build-amd64, build-arm64]
    if: >-
      vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true' &&
      always() && !cancelled() && needs.build-amd64.result == 'success' &&
      needs.resolve.outputs.source_ref == 'dev' &&
      (needs.resolve.outputs.platform == 'amd64' ||
      (needs.resolve.outputs.platform == 'both' && needs.build-arm64.result == 'success'))
    concurrency:
      group: panda-dev-image-promotion
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: promote
        name: Retag exact current dev candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PLATFORM: ${{ needs.resolve.outputs.platform }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          image, source = os.environ["IMAGE"], os.environ["SOURCE_SHA"]
          if os.environ["SOURCE_REF"] != "dev":
              raise SystemExit("Development promotion requires source_ref=dev")
          current = subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/dev", "--jq", ".object.sha",
          ], text=True).rstrip("\n")
          if current != source:
              raise SystemExit("The upstream dev branch advanced during candidate promotion; refusing to move :dev.")
          architectures = ["amd64", "arm64"] if os.environ["PLATFORM"] == "both" else ["amd64"]
          manifests = [f"{image}:candidate-{source}-{arch}" for arch in architectures]
          for manifest in manifests:
              subprocess.run(["docker", "buildx", "imagetools", "inspect", manifest], check=True, stdout=subprocess.DEVNULL)
          metadata = Path(os.environ["RUNNER_TEMP"]) / "dev-image-metadata.json"
          subprocess.run([
              "docker", "buildx", "imagetools", "create", "--metadata-file", str(metadata), "--tag", f"{image}:dev", *manifests,
          ], check=True)
          details = json.loads(metadata.read_text())
          descriptor = details.get("containerimage.descriptor")
          digest = descriptor.get("digest") if isinstance(descriptor, dict) else None
          if digest is None:
              digest = details.get("containerimage.digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("Promotion did not return an immutable SHA-256 digest")
          published = subprocess.check_output([
              "docker", "buildx", "imagetools", "inspect", f"{image}:dev", "--format", "{{.Manifest.Digest}}",
          ], text=True).rstrip("\n")
          if published != digest:
              raise SystemExit("The moving dev tag did not resolve to the promoted immutable digest.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"digest={digest}\n")
          platforms = ", ".join(f"linux/{arch}" for arch in architectures)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join([
                  "### Development image promotion", f"- Source commit: `{source}`",
                  f"- Platforms: `{platforms}`", f"- Digest: `{digest}`", f"- Tag: `{image}:dev`",
              ]) + "\n")
          PY
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

  prune-candidates:
    name: Prune stale candidates
    needs: [resolve, build-amd64, build-arm64]
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true' && (always() && !cancelled() && (needs.build-amd64.result == 'success' || needs.build-arm64.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Retain recent commit candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          package = f"/users/{os.environ['GITHUB_REPOSITORY_OWNER']}/packages/container/panda/versions"
          listing = subprocess.check_output([
              "gh", "api", "--paginate", package + "?per_page=100",
              "--jq", '.[] | [.created_at, .id, (.metadata.container.tags | join(","))] | @tsv',
          ], text=True)
          candidates = {"amd64": [], "arm64": []}
          legacy = []
          for row in listing.splitlines():
              fields = row.split("\t")
              if len(fields) < 3:
                  continue
              created, version_id, tags = fields[:3]
              candidate = re.fullmatch(r"candidate-[0-9a-f]{40}-(amd64|arm64)", tags)
              if candidate:
                  candidates[candidate[1]].append((created, version_id))
              elif re.fullmatch(r"[0-9a-f]{7}-dev", tags):
                  legacy.append(version_id)
          obsolete = []
          for arch, limit in [("amd64", 10), ("arm64", 3)]:
              ordered = sorted(candidates[arch], key=lambda item: "\t".join(item), reverse=True)
              obsolete.extend(version_id for _, version_id in ordered[limit:])
          obsolete.extend(legacy)
          for version_id in obsolete:
              subprocess.run(["gh", "api", "--method", "DELETE", f"{package}/{version_id}"], check=True)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"- Stale candidates deleted: {len(obsolete)}\n")
          PY
