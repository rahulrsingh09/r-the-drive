name: Fork validation

on:
  pull_request:
    branches: [mainline]
  push:
    branches: [mainline, 'review/**', 'integrate/**', 'automation/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable candidate commit from the trusted sync job
        required: true
        type: string
      baseline_sha:
        description: Immutable hardened parent captured by the trusted sync job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-validation-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  SQLX_OFFLINE: 'true'

jobs:
  frontend:
    if: github.repository == 'your-org/r-the-drive'
    name: Fork frontend and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap:check
      - run: pnpm deps:check
      - run: pnpm security:routes
      - run: pnpm test:scripts
      - name: Verify native release admission, backup and data guards
        run: |
          python3 -B scripts/test_native_deploy.py
          python3 -B scripts/test_native_guard.py
          python3 -B scripts/test_deploy.py
      - name: Verify deployed migration identities
        env:
          BASE_SHA: ${{ inputs.baseline_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          supplied = os.environ["BASE_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", supplied) and set(supplied) != {"0"}:
              baseline = supplied
          else:
              baseline = None
              for revision in ["HEAD^1", "HEAD"]:
                  resolved = subprocess.run(["git", "rev-parse", revision], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
                  if resolved.returncode == 0:
                      baseline = resolved.stdout.rstrip("\n")
                      break
              if baseline is None:
                  raise SystemExit("Cannot resolve the migration baseline")
          subprocess.run(["node", "scripts/fork-migration-integrity.mjs", baseline], check=True)
          PY
      - name: Verify origin gateway with nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          python3 scripts/test-origin-gate.py
      - name: Verify private gateway in the Workers runtime
        run: |
          pnpm --filter @panda/private-gateway build
          npm install --prefix "$RUNNER_TEMP/gateway-runtime" --ignore-scripts --no-fund --no-audit --registry https://registry.npmjs.org miniflare@5.20261001.0-alpha
          PANDA_MINIFLARE_MODULE="$RUNNER_TEMP/gateway-runtime/node_modules/miniflare" node apps/private-gateway/runtime-check.mjs
          PANDA_MINIFLARE_MODULE="$RUNNER_TEMP/gateway-runtime/node_modules/miniflare" node apps/private-gateway/backup-runtime-check.mjs
      - run: pnpm test:packages
      - name: Install local Chromium
        run: pnpm --filter @panda/web exec playwright install --with-deps chromium
      - name: Verify R routes, editing, login and read-only controls in a real browser
        run: pnpm --filter @panda/web exec playwright test --workers=1
      - run: pnpm docs:check
      - run: pnpm build
      - name: Evaluate every npm advisory
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path


          report = Path(os.environ["RUNNER_TEMP"]) / 'npm-audit.json'
          with report.open("w") as destination:
              result = subprocess.run(['pnpm', 'audit', '--json'], stdout=destination)
          status = result.returncode if result.returncode >= 0 else 128 - result.returncode
          subprocess.run(["node", 'scripts/check-dependency-audits.mjs', 'pnpm', str(report), str(status)], check=True)
          PY

  backend:
    if: github.repository == 'your-org/r-the-drive'
    name: Fork backend and security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: timescale/timescaledb:2.28.3-pg18@sha256:2c718e700b1c75b93488085596f2254c991c3aa29584fc282ebbe62fd8335791
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/
      KEY_CUSTODY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/postgres
      TRIP_DURABILITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/postgres
      HISTORY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/postgres
      PANDA_TEST_REDIS_URL: redis://127.0.0.1:6379/
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - run: cargo fmt --all --check
      - run: cargo build --locked --bins
      - run: cargo test --locked --lib
      - run: cargo test --locked --lib db::migrations::tests -- --ignored --test-threads=1
      - run: cargo test --locked --test dependency_crypto
      - name: Authentication integration regressions (including incoming upstream cases)
        run: |
          (cd ../.. && node scripts/fork-auth-contract.mjs)
          cargo test --locked --test auth_integration -- --test-threads=1
      - run: cargo test --locked --lib authorization_ -- --ignored --test-threads=1
      - run: cargo test --locked --lib keys::tests::database_custody -- --ignored
      - run: cargo test --locked --lib history::tests::database_history -- --ignored --test-threads=1
      - run: cargo test --locked --lib ingestion::worker::trip_capture::tests -- --ignored --test-threads=1
      - name: Evaluate every Cargo advisory
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          subprocess.run(["cargo", "install", "cargo-audit", "--version", "0.22.2", "--locked"], check=True)

          report = Path(os.environ["RUNNER_TEMP"]) / 'cargo-audit.json'
          with report.open("w") as destination:
              result = subprocess.run(['cargo', 'audit', '--deny', 'warnings', '--json'], stdout=destination)
          status = result.returncode if result.returncode >= 0 else 128 - result.returncode
          subprocess.run(["node", '../../scripts/check-dependency-audits.mjs', 'cargo', str(report), str(status)], check=True)
          PY
