name: Release image

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Calendar Version tag to publish
        required: true
        type: string
      include_arm64:
        description: Merge a prebuilt ARM64 candidate into this release
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  OWNER: your-org

jobs:
  validate-tag:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      include_arm64: ${{ steps.version.outputs.include_arm64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          INCLUDE_ARM64: ${{ inputs.include_arm64 || false }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          if re.fullmatch(r"[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]+", version) is None:
              raise SystemExit("Invalid calendar release version: " + version)

          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", os.environ["GITHUB_SHA"], "origin/main"], check=True)

          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).rstrip("\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.writelines(f"{key}={value}\n" for key, value in [
                  ("version", version), ("source_sha", source), ("include_arm64", os.environ["INCLUDE_ARM64"]),
              ])
          PY

  promote-image:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Promote commit candidate
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: promote
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          INCLUDE_ARM64: ${{ needs.validate-tag.outputs.include_arm64 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          started = int(time.time())
          image, version, source = (os.environ[key] for key in ("IMAGE", "VERSION", "SOURCE_SHA"))
          architectures = ["amd64", "arm64"] if os.environ["INCLUDE_ARM64"] == "true" else ["amd64"]
          candidates = {arch: f"{image}:candidate-{source}-{arch}" for arch in architectures}
          manifests = []
          for arch, candidate in candidates.items():
              subprocess.run(["docker", "buildx", "imagetools", "inspect", candidate], check=True, stdout=subprocess.DEVNULL)

              stamped = f"{image}:release-{version}-{arch}"
              with Path("compose/Dockerfile.release-stamp").open("rb") as recipe:
                  subprocess.run([
                      "docker", "buildx", "build", "--platform", f"linux/{arch}", "--provenance=false", "--push",
                      "--build-arg", f"BASE_IMAGE={candidate}", "--build-arg", f"PANDA_BUILD_VERSION={version}",
                      "--tag", stamped, "-",
                  ], stdin=recipe, check=True)
              manifests.append(stamped)

          metadata = Path(os.environ["RUNNER_TEMP"]) / 'release-image-metadata.json'
          tags = ["--tag", f"{image}:{version}", "--tag", f"{image}:latest"]
          subprocess.run(["docker", "buildx", "imagetools", "create", "--metadata-file", str(metadata), *tags, *manifests], check=True)
          details = json.loads(metadata.read_text())
          descriptor = details.get("containerimage.descriptor")
          digest = descriptor.get("digest") if isinstance(descriptor, dict) else None
          if digest is None:
              digest = details.get("containerimage.digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("Promotion did not return an immutable SHA-256 digest")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"digest={digest}\n")
          platforms = ", ".join(f"linux/{arch}" for arch in architectures)
          lines = [
              '### Release promotion', f"- Source commit: `{source}`", f"- Platforms: `{platforms}`",
              f"- Digest: `{digest}`", f"- Promotion: {int(time.time()) - started}s",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/panda
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

  release-smoke:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Smoke test
    needs: [validate-tag, promote-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - name: Authenticate release smoke test to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create ephemeral production environment
        run: |
          python3 - <<'PY'
          import os
          import re
          import secrets
          from pathlib import Path

          destination = Path(os.environ["RUNNER_TEMP"]) / 'release-smoke.env'
          values = {
              "POSTGRES_PASSWORD": 'release-smoke-password',
              "REDIS_PASSWORD": 'release-smoke-redis-password',
              "ALLOWED_ORIGINS": 'https://release-smoke.example.test',
          }
          content = Path("compose/.env.example").read_bytes().decode()
          pattern = re.compile(r"(POSTGRES_PASSWORD|REDIS_PASSWORD|ALLOWED_ORIGINS)=.*")
          content = pattern.sub(lambda match: match[1] + "=" + values[match[1]], content)
          destination.write_bytes((content + "PANDA_SETUP_TOKEN=" + secrets.token_hex(32) + "\n").encode())
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write('RELEASE_SMOKE_ENV' + "=" + str(destination) + "\n")
          PY
      - name: Exercise published image-only stack
        run: node scripts/verify-fresh-install.mjs --mode production --production-env "$RELEASE_SMOKE_ENV" --image-ref "${{ env.REGISTRY }}/${{ env.OWNER }}/panda@${{ needs.promote-image.outputs.digest }}"

  populated-upgrade:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Populated upgrade (linux/amd64)
    needs: [validate-tag, promote-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg18@sha256:2c718e700b1c75b93488085596f2254c991c3aa29584fc282ebbe62fd8335791
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: panda
          POSTGRES_PASSWORD: devpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U panda -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      UPGRADE_DATABASE_URL: postgresql://panda:devpassword@127.0.0.1:5432/panda_upgrade_amd64
      REDIS_URL: redis://127.0.0.1:6379
      UPGRADE_IMAGE: ghcr.io/your-org/r-the-drive@${{ needs.promote-image.outputs.digest }}
      UPGRADE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/api
          shared-key: panda-api
          save-if: false
      - name: Install sqlx-cli
        working-directory: apps/api
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      - name: Verify populated upgrade on the release image
        run: node scripts/verify-populated-upgrade.mjs

  create-release:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Create release
    needs: [validate-tag, promote-image, release-smoke, populated-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - name: Verify published image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.OWNER }}/panda@${{ needs.promote-image.outputs.digest }}"
      - name: Create digest lock and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          IMAGE_DIGEST: ${{ needs.promote-image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          Path("images.lock").write_text("ghcr.io/your-org/r-the-drive@" + os.environ["IMAGE_DIGEST"] + "\n")
          assets = [("compose/docker-compose.yml", "docker-compose.yml"), ("compose/.env.example", "example.env")]
          for source, destination in assets:
              shutil.copyfile(source, destination)
          version, repository = os.environ["VERSION"], os.environ["GITHUB_REPOSITORY"]
          arguments = [version, "images.lock#images.lock", "docker-compose.yml#docker-compose.yml", "example.env#example.env", "--repo", repository]

          lookup = subprocess.run(["gh", "release", "view", version, "--repo", repository], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          operation, options = ("upload", ["--clobber"]) if lookup.returncode == 0 else ("create", ["--title", version, "--generate-notes"])
          subprocess.run(["gh", "release", operation, *arguments, *options], check=True)
          PY
