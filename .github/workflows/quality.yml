name: PR Quality

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  quality:
    if: vars.PANDA_ENABLE_RELEASE_AUTOMATION == 'true'
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Reject generated state and duplicate lockfiles
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          forbidden_segments = {".codex", ".claude", "node_modules", "target", "dist", "coverage", ".turbo", ".playwright-cli"}
          forbidden_files = {"package-lock.json", "test_output.txt"}
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          violations = []
          for path in tracked:
              parts = path.split("/")
              if forbidden_segments.intersection(parts) or parts[-1] in forbidden_files or parts[-1].endswith(".tmp"):
                  violations.append(path)
          if violations:
              print("Generated or local-only files are tracked:")
              print("\n".join(violations))
              raise SystemExit(1)
          print("Repository hygiene check passed")
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency policy
        run: pnpm deps:check
      - name: Peer dependencies
        run: pnpm peers check
      - name: Lint
        run: pnpm turbo lint
      - name: Color-token guard
        run: pnpm colors:check
      - name: Docs check
        run: pnpm docs:check
      - name: Compose deployment contracts
        run: pnpm compose:check
      - name: Release workflow contract
        run: pnpm release-workflows:check
      - name: Render standard and Synology Compose files
        run: pnpm compose:render-check
      - name: Detect documentation-site changes
        id: docs-changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          paths = ['docs', 'apps/docs', 'apps/web/public/favicon.svg', 'apps/web/public/logo_color_lighter.svg', 'packages/ui/src/tokens', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'scripts/check-docs.mjs', 'compose', '.github/workflows/publish-docs.yml', '.github/workflows/quality.yml']
          changed = True

          comparison = subprocess.run(["git", "diff", "--name-only", "-z", os.environ["BASE_SHA"], "HEAD", "--", *paths], stdout=subprocess.PIPE)
          changed = comparison.returncode != 0 or bool(comparison.stdout)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write('changed' + "=" + str(changed).lower() + "\n")
          PY
      - name: Build documentation site
        if: steps.docs-changes.outputs.changed == 'true'
        run: pnpm docs:build
      - name: Dashboard default drift check
        run: pnpm dashboards:sync-defaults --check
      - name: Chart default drift check
        run: pnpm charts:sync-defaults --check
