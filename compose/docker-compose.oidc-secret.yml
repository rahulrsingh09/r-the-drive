services:
  panda:
    environment:
      PANDA_OIDC_CLIENT_SECRET_FILE: /run/secrets/panda-oidc-client-secret
    volumes:
      - type: bind
        source: ${PANDA_OIDC_CLIENT_SECRET_SOURCE:?Set PANDA_OIDC_CLIENT_SECRET_SOURCE to the host secret file}
        target: /run/secrets/panda-oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
